<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entertainer Games</title>
<meta name="description" content="Entertainer Games is an indie mobile game studio. Play our games free: Bubbly Slide Rush on iPhone, Breakshift coming soon.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://azimkasimov.github.io/entertainer-games/">
<meta property="og:title" content="Entertainer Games: play our games free">
<meta property="og:description" content="Indie mobile game studio. Bubbly Slide Rush is free on iPhone; Breakshift is coming soon.">
<meta property="og:image" content="https://azimkasimov.github.io/entertainer-games/og.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://azimkasimov.github.io/entertainer-games/og.jpg?v=2">
<meta name="theme-color" content="#141432">
<link rel="icon" href="logo.png?v=2">
<link rel="apple-touch-icon" href="logo.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<script>
// Store links per game. Set a link to null while the game isn't on that store yet.
var GAMES = {
  bubbly: {
    name: "Bubbly Slide Rush",
    tag: "Roll a giggly bubble down 400 crazy water slides",
    icon: "bubbly.png?v=2", // bump ?v= when replacing an icon so browsers drop the cached one
    ios: "https://apps.apple.com/app/id6829602884",
    android: null // closed testing; then: "https://play.google.com/store/apps/details?id=com.funnyballgames.bubbleslide"
  },
  breakshift: {
    name: "Breakshift",
    tag: "Tactical ricochet brick breaker",
    icon: "breakshift.png",
    ios: null,
    android: null // "https://play.google.com/store/apps/details?id=com.funnyballgames.breakshift"
  }
};
var DEFAULT_GAME = "bubbly"; // where the plain link (no ?g=) sends phones

var ua = navigator.userAgent || "";
var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
var isAndroid = /Android/i.test(ua);
var params = new URLSearchParams(location.search);
var key = (params.get("g") || DEFAULT_GAME).toLowerCase();
var game = GAMES[key] || GAMES[DEFAULT_GAME];

// Source tracking: links in bios/descriptions carry ?src=tt|ig|yt (default "web").
// App Store: campaign shows in App Store Connect > Analytics > Campaigns (needs 5+ installs per campaign).
// Google Play: shows as utm_source in Play Console acquisition reports.
var APPLE_PROVIDER_TOKEN = "129723438"; // App Store Connect provider token (same for all our apps)
var src = (params.get("src") || "web").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 20) || "web";
function track(url) {
  if (!url) return url;
  if (url.indexOf("apps.apple.com") >= 0)
    return url + (url.indexOf("?") >= 0 ? "&" : "?") + "pt=" + APPLE_PROVIDER_TOKEN + "&ct=" + src + "&mt=8";
  if (url.indexOf("play.google.com") >= 0)
    return url + "&referrer=" + encodeURIComponent("utm_source=" + src + "&utm_medium=social&utm_campaign=entertainer_games");
  return url;
}
var target = track(isIOS ? game.ios : isAndroid ? game.android : null);
if (target) location.replace(target);
</script>
<style>
  :root { --bg:#141432; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.10); --text:#fff6ee; --muted:#c3b6d6;
          --a:#ffb02e; --b:#ff3d8b; --ink:#1b1450; }
  * { box-sizing: border-box; }
  body { margin:0; color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh;
         background: radial-gradient(ellipse at 50% 0%, #3a1a7a 0%, #1d1650 40%, var(--bg) 75%) fixed, var(--bg);
         display:flex; flex-direction:column; align-items:center; padding:28px 16px 24px; }
  .brand { font-family:"Fredoka",system-ui,sans-serif; }
  header { text-align:center; margin-bottom:22px; }
  .hero { position:relative; width:220px; height:190px; margin:0 auto; }
  .hero .mascot { width:170px; position:absolute; left:0; top:0; filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));
                  animation:bob 3s ease-in-out infinite; }
  .hero .logo { width:84px; height:84px; border-radius:50%; position:absolute; right:0; bottom:6px;
                box-shadow:0 0 0 4px #fff, 0 8px 18px rgba(0,0,0,.45); }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
  @media (prefers-reduced-motion: reduce) { .hero .mascot { animation:none; } }
  h1 { margin:8px 0 2px; font-size:34px; font-weight:700; letter-spacing:.5px; line-height:1.05;
       background:linear-gradient(180deg,var(--a),#ff8a3d 45%,var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p { margin:0; color:var(--muted); }
  main { width:100%; max-width:440px; display:grid; gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px; display:grid;
          grid-template-columns:76px 1fr; gap:14px; align-items:center; backdrop-filter:blur(6px); }
  .card.hl { border:2px solid var(--b); box-shadow:0 0 24px rgba(255,61,139,.25); }
  .card img { width:76px; height:76px; border-radius:18px; box-shadow:0 0 0 2px #fff; }
  .card h2 { margin:0; font-size:19px; font-weight:700; }
  .card p { margin:2px 0 10px; color:var(--muted); font-size:14px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { display:inline-block; padding:9px 16px; border-radius:12px; font-size:15px; font-weight:700; text-decoration:none; color:#fff;
         background:linear-gradient(90deg,#ff8a3d,var(--b)); box-shadow:0 3px 0 var(--ink); }
  .soon { padding:8px 12px; border-radius:12px; font-size:14px; color:var(--muted); background:rgba(255,255,255,.08); }
  .social { display:flex; gap:18px; justify-content:center; margin-top:26px; }
  .social a { color:var(--text); text-decoration:none; font-size:14px; font-weight:600; opacity:.9; }
  footer { margin-top:auto; padding-top:22px; color:var(--muted); font-size:13px; text-align:center; }
</style>
</head>
<body>
<header>
  <div class="hero"><img class="mascot" src="mascot.png" alt=""><img class="logo" src="logo.png?v=2" alt="Entertainer Games logo"></div>
  <h1 class="brand">Entertainer Games</h1>
  <p>Indie mobile game studio · play our games free</p>
</header>
<main id="list"></main>
<nav class="social brand">
  <a href="https://www.instagram.com/entertainer.games/">Instagram</a>
  <a href="https://www.tiktok.com/@entertainer.games">TikTok</a>
  <a href="https://www.youtube.com/@entertainer-games">YouTube</a>
</nav>
<footer>New clips every week</footer>
<script>
var list = document.getElementById("list");
Object.keys(GAMES).forEach(function (k) {
  var g = GAMES[k], card = document.createElement("div");
  card.className = "card" + (k === key && !target ? " hl" : "");
  function btn(url, label) {
    return url ? '<a class="btn" href="' + url + '">' + label + '</a>'
               : '<span class="soon">' + label + ': coming soon</span>';
  }
  var ios = track(g.ios), android = track(g.android);
  var buttons = !g.ios && !g.android ? '<span class="soon">Coming soon</span>'
              : isIOS ? btn(ios, "App Store")
              : isAndroid ? btn(android, "Google Play")
              : btn(ios, "App Store") + btn(android, "Google Play");
  card.innerHTML = '<img src="' + g.icon + '" alt=""><div><h2 class="brand">' + g.name + '</h2><p>' + g.tag +
                   '</p><div class="btns">' + buttons + '</div></div>';
  list.appendChild(card);
});
</script>
</body>
</html>
